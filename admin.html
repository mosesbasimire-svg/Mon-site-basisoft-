<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administration — BASISOFT</title><style>body{font-family:Arial,sans-serif;background:#f2f6fc;margin:0;color:#17243a}.box{max-width:760px;margin:28px auto;background:white;padding:24px;border-radius:16px;box-shadow:0 4px 22px #0001}h1{color:#1264d8}input,button{font:inherit;padding:12px;margin:6px 0;border:1px solid #ccd5e2;border-radius:8px;width:100%;box-sizing:border-box}button{background:#1264d8;color:white;border:0;cursor:pointer}button.secondary{background:#596579}.hidden{display:none}.ad{padding:12px;border:1px solid #ddd;border-radius:10px;margin:12px 0}.ad img{max-width:180px;display:block;margin:8px 0}small{color:#64748b}</style></head><body><div class="box"><h1>Administration BASISOFT</h1><p>Connectez-vous avec votre compte administrateur Supabase.</p><section id="login"><input id="email" type="email" placeholder="E-mail administrateur"><input id="password" type="password" placeholder="Mot de passe"><button onclick="signIn()">Se connecter</button><p id="error"></p></section><section id="panel" class="hidden"><button class="secondary" onclick="signOut()">Déconnexion</button><h2>Statistiques des visites</h2><p id="stats">Chargement…</p><hr><h2>Ajouter une publicité</h2><input id="title" placeholder="Titre de la publicité"><input id="file" type="file" accept="image/*"><button onclick="uploadAd()">Publier l'image</button><p id="msg"></p><h2>Publicités existantes</h2><div id="ads"></div></section></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const ready=window.SUPABASE_URL.startsWith('https://')&&window.SUPABASE_ANON_KEY.startsWith('ey');let sb;if(ready)sb= supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);
function check(){if(!ready)document.getElementById('error').textContent='Configurez d’abord config.js avec l’URL et la clé anon de votre projet Supabase.'}
async function signIn(){if(!ready)return check();let {data,error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error){document.getElementById('error').textContent=error.message;return}document.getElementById('login').classList.add('hidden');document.getElementById('panel').classList.remove('hidden');await loadAll()}
async function signOut(){await sb.auth.signOut();location.reload()}
async function loadAll(){let {data:vis}=await sb.from('visites').select('date_visite');let now=new Date(),today=now.toLocaleDateString();let count=(vis||[]).filter(v=>new Date(v.date_visite).toLocaleDateString()===today).length;document.getElementById('stats').textContent=`Aujourd’hui : ${count} visites · Total : ${(vis||[]).length} visites`;let {data,error}=await sb.from('publicites').select('*').order('created_at',{ascending:false});document.getElementById('ads').innerHTML=error?error.message:(data||[]).map(a=>`<div class="ad"><b>${a.titre}</b><img src="${a.image_url}"><small>Actif : ${a.actif?'oui':'non'}</small><button onclick="toggleAd(${a.id},${!a.actif})">${a.actif?'Désactiver':'Activer'}</button><button class="secondary" onclick="deleteAd(${a.id},'${a.image_url.split('/').pop()}')">Supprimer</button></div>`).join('')||'Aucune publicité.'}
async function uploadAd(){let f=document.getElementById('file').files[0],title=document.getElementById('title').value.trim();if(!f||!title){msg.textContent='Indiquez un titre et choisissez une image.';return}let path=Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');let up=await sb.storage.from('publicites').upload(path,f);if(up.error){msg.textContent=up.error.message;return}let url=sb.storage.from('publicites').getPublicUrl(path).data.publicUrl;let ins=await sb.from('publicites').insert({titre:title,image_url:url,actif:true});msg.textContent=ins.error?ins.error.message:'Publicité publiée.';await loadAll()}
async function toggleAd(id,active){await sb.from('publicites').update({actif:active}).eq('id',id);await loadAll()}
async function deleteAd(id,path){if(!confirm('Supprimer cette publicité ?'))return;await sb.from('publicites').delete().eq('id',id);await sb.storage.from('publicites').remove([path]);await loadAll()}check();</script></body></html>
